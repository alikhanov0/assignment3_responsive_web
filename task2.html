<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <style>
    .demo-column { min-height: 190px; padding: 28px; }
    .demo-column p { color: #6b7280; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="container py-5">
    <span class="badge-soft">Part 2 · Task 2</span>
    <h1 class="mt-3">Bootstrap Responsive Columns</h1>
    <p class="text-secondary mb-4">Uses Bootstrap's 12-column grid: col-12 col-md-6 col-lg-4.</p>
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card-like demo-column h-100"><h2>Column 1</h2><p>12/12 on mobile, 6/12 on tablet, 4/12 on desktop.</p></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card-like demo-column h-100"><h2>Column 2</h2><p>Two columns fit on the first tablet row.</p></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card-like demo-column h-100"><h2>Column 3</h2><p>Moves to the second row on tablet.</p></div>
      </div>
    </div>
  </main>
</body>
</html>
